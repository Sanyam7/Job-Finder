# Netlify — the VeriHire web client.
#
# ★ Netlify hosts the CLIENT ONLY.
#
# The Express API is not deployable here, and this is not a limitation worth fighting.
# The server holds open a Mongo connection pool, a Redis connection for the rate limiter
# and the refresh-token family store, and a BullMQ worker that must outlive any single
# request. Netlify Functions are stateless and time-boxed; every one of those would break.
# The API belongs on a host that runs a normal long-lived process — Render, Railway, Fly,
# or a VM. See docs/10-DEPLOYMENT.md.
#
# ★ Redirects and headers are deliberately NOT in this file.
#
# They live in client/public/_redirects and client/public/_headers, which Vite copies
# verbatim into dist/. That way the rules are part of the build artifact and behave
# identically for a CI git build and a direct `--dir` upload; netlify.toml rules are
# resolved against the repo and would silently vanish from the latter. Keeping them in one
# place also avoids the precedence trap — netlify.toml redirects override _redirects
# entirely rather than merging, so a half-populated copy here would mask the real rules.

[build]
  # This is an npm workspaces monorepo, so the build runs from the repo root: the client
  # imports @verihire/shared, which only resolves once the root install has linked the
  # workspaces together.
  command = "npm run build --workspace=client"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "20"
  # Netlify installs with --production by default, which would skip Vite itself.
  NPM_FLAGS = "--include=dev"
