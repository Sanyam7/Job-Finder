# Render — the VeriHire API.
#
# Netlify serves the React client; this file describes the server half. The two are joined
# by the /api/* proxy in client/public/_redirects, which must point at this service's URL.
# That proxy is not a convenience: the refresh token is an httpOnly SameSite=Strict cookie,
# and Strict means the browser will not send it on a cross-site request. Talking to this
# API directly from the browser would log users in and then log them out ~15 minutes later
# when the access token expired and the refresh call arrived without its cookie.

services:
  - type: web
    name: verihire-api
    runtime: node
    plan: free
    region: singapore
    branch: main

    # The repo is an npm workspaces monorepo and the build runs from its root, not from
    # server/. The server imports @verihire/shared, which only resolves once the root
    # install has linked the workspaces together — a build scoped to server/ would fail on
    # that import at startup, not at install time.
    rootDir: .
    buildCommand: npm ci
    startCommand: npm run start --workspace=server

    # env.js refuses to boot on missing or malformed config, so a bad deploy fails here
    # rather than serving traffic with a half-configured process. Render holds the old
    # instance until this path returns 200.
    healthCheckPath: /api/v1/health

    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: /api/v1

      # Where the browser actually is. CLIENT_URL builds the links in outbound email;
      # CORS_ORIGINS is the allowlist. Both are the Netlify origin rather than this
      # service's own URL, because every browser request arrives via the Netlify proxy.
      - key: CLIENT_URL
        value: https://verihire-portal.netlify.app
      - key: CORS_ORIGINS
        value: https://verihire-portal.netlify.app

      # Render terminates TLS at its edge and Netlify proxies in front of that, so the
      # socket address is always a proxy. Without this, express-rate-limit would bucket
      # every visitor under one address — one abusive client would lock out the world —
      # and secure cookies would not be recognised as being served over HTTPS.
      - key: TRUST_PROXY
        value: "true"

      # Generated by Render, once, and never displayed. Deliberately not the values from
      # anyone's local .env: a development secret that leaks costs nothing, and the same
      # secret in production costs everything.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true

      # Host-only. Setting a domain here would widen the refresh cookie to every subdomain.
      - key: COOKIE_DOMAIN
        value: ""

      # ---------------------------------------------------------------- must be supplied
      # sync: false means Render prompts rather than storing these in git. The process will
      # not boot until all of them are set — see env.js, which validates at startup.

      # MongoDB Atlas. Render has no managed MongoDB, so this is an external service.
      # The connection string must include the database name and the Atlas network
      # allowlist must permit Render's egress.
      - key: MONGO_URI
        sync: false

      # Cloudinary — canonical storage for CVs and verification documents.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # SMTP — required only when EMAIL_ENABLED is true.
      #
      # This deployment runs with mail off: messages are written to the Render log rather
      # than sent. That is survivable here only because login does not gate on a verified
      # address (see auth.service.js), so accounts can still register and sign in. Password
      # reset cannot complete, because the link never reaches anyone.
      #
      # To turn mail on, set EMAIL_ENABLED=true and supply all three of these — the process
      # will refuse to boot without them, which is the point.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: VeriHire <no-reply@verihire.app>
      - key: EMAIL_ENABLED
        value: "false"

      # ------------------------------------------------------------------------- queues
      #
      # ★ REDIS_URL is intentionally NOT set, and that is not an oversight.
      #
      # Queue consumers are registered by worker.js only, never by the API process
      # (see server/src/queues/workers.js). With no REDIS_URL, resume parsing runs inline
      # and works. With REDIS_URL set but no worker service running, enqueue SUCCEEDS,
      # returns {queued: true}, and the job then waits for a consumer that does not exist —
      # so uploaded CVs are never parsed and nothing anywhere reports an error.
      #
      # Render background workers are a paid feature. Until one exists, no Redis is the
      # correct configuration, not the degraded one. Single-instance also means the
      # in-memory rate limiter is exact rather than approximate.
      #
      # To enable both together, uncomment the keyvalue store and the worker below and add:
      #   - key: REDIS_URL
      #     fromService: { name: verihire-redis, type: keyvalue, property: connectionString }

  # - type: worker
  #   name: verihire-worker
  #   runtime: node
  #   plan: starter          # workers have no free plan
  #   rootDir: .
  #   buildCommand: npm ci
  #   startCommand: npm run start:worker --workspace=server
  #   envVars:
  #     - fromGroup: verihire-shared   # must see the same Mongo, Cloudinary and Redis

# databases / key-value
# - type: keyvalue
#   name: verihire-redis
#   plan: free
#   region: singapore
#   maxmemoryPolicy: noeviction   # BullMQ loses jobs under any evicting policy
